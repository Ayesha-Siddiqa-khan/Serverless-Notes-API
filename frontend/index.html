<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Notes • Cloud Studio</title>
    <!-- Modern Typography: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Ambient Aura Glows -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-badge">
                <span class="badge-dot"></span>
                <span>AWS Cloud Native</span>
            </div>
            <div class="logo">
                <div class="logo-icon-wrap">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9"></path>
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                    </svg>
                </div>
                <h1>Serverless Notes</h1>
            </div>
            <p class="subtitle">
                <span>Lambda Function</span>
                <span class="sep">•</span>
                <span>DynamoDB</span>
                <span class="sep">•</span>
                <span>API Gateway</span>
            </p>
        </header>

        <!-- Config Section with Collapsible Clean Look -->
        <div class="config glass-card">
            <div class="config-header">
                <div class="config-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    <label for="apiUrl">API Gateway Endpoint</label>
                </div>
                <span class="status-indicator">Connected</span>
            </div>
            <div class="input-wrapper">
                <input type="text" id="apiUrl" placeholder="https://your-api-id.execute-api.region.amazonaws.com" spellcheck="false">
            </div>
        </div>

        <!-- Note Creation Form -->
        <div class="note-form glass-card">
            <div class="form-header">
                <h2 id="formTitle">Create New Note</h2>
                <span class="form-subtitle">Store notes securely in DynamoDB</span>
            </div>
            <form id="noteForm">
                <input type="hidden" id="noteId">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" placeholder="Give your note a title..." required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="content">Content</label>
                    <textarea id="content" rows="4" placeholder="Capture your thoughts, ideas, or reminders..." required></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Create Note</span>
                    </button>
                    <button type="button" class="btn btn-secondary" id="cancelBtn" style="display:none">
                        <span>Cancel</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Notes Section Header -->
        <div class="notes-header">
            <div class="section-title">
                <h2>All Notes</h2>
                <span class="notes-count" id="notesCount"></span>
            </div>
            <button class="btn btn-outline" id="refreshBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
                <span>Sync</span>
            </button>
        </div>

        <!-- Notes Grid -->
        <div class="notes-grid" id="notesContainer">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Retrieving notes from cloud...</p>
            </div>
        </div>

        <!-- Empty State -->
        <div class="empty-state glass-card" id="emptyState" style="display:none">
            <div class="empty-icon-wrap">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
            </div>
            <h3>No notes discovered yet</h3>
            <p>Your notes will appear here once created. Try drafting your first one above!</p>
        </div>
    </div>

    <!-- Floating Feedback Toast -->
    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
